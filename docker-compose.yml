services:
  kkal:
    build: .
    container_name: kkal
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/kkal.sqlite
    volumes:
      - ./data:/app/data
    # Open only on localhost: nginx/Caddy on the same machine proxies to it.
    # Change 3010 if that port is taken on your server.
    ports:
      - "127.0.0.1:3010:3000"
